name: Deploy Portfolio to AWS

on:
  push:
    branches:
      - main  # Se a tua branch principal for master, altera aqui para master

permissions:
  id-token: write   # Obrigatório para autenticação via OIDC
  contents: read    # Necessário para fazer checkout do código

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::339712868174:role/PortfolioDeploymentPolicy
          aws-region: eu-north-1

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://gmf-cloud-resume-2026 --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E2O4GNJN0TFRAZ \
            --paths "/*"